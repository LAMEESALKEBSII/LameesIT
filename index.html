<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamees</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #ffebee, #f8bbd0); /* خلفية وردية فاتحة */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        header {
            background-color: #ff4081; /* لون وردي */
            color: white;
            padding: 15px 0;
            text-align: center;
            width: 100%;
            border-radius: 10px 10px 0 0;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        h2 {
            margin: 5px 0 0;
            font-size: 1.5em;
            color: white; /* جعل النص أبيض */
        }
        .content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Lamees</h1>
        <h2>Welcome to My Page!</h2>
    </header>
</body>
</html>
